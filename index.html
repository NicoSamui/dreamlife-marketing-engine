<!doctype html>
<html lang="de" data-mode="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dreamlife Marketing Engine</title>
<meta name="description" content="Dreamlife Marketing Engine: Zielgruppenanalyse, Marketing-Winkel und Kampagnen-Assets für dein Projekt.">
<script>window.APP_VERSION="1.2.1";</script>
<script>
(function(){
  try{
    var m = localStorage.getItem('dlm-mode');
    if(m!=='dark' && m!=='normal') m='dark';
    document.documentElement.setAttribute('data-mode', m);
  }catch(e){ document.documentElement.setAttribute('data-mode','dark'); }
})();
</script>
<link rel="stylesheet" href="/shared/pages.css">
<link rel="stylesheet" href="/app.css">
</head>
<body>

  <div class="dlm-app" id="dlm-app" hidden>

    <div class="dlp-update" id="dlm-update" hidden>
      <span id="dlm-update-text">Neue Version, bitte neu laden</span>
      <button type="button" id="dlm-update-go">Aktualisieren</button>
    </div>

    <header class="dlp-bar" id="dlm-bar">
      <div class="dlp-brand"><span class="dlp-dot" aria-hidden="true"></span><span class="dlm-brand-full">Dreamlife Marketing Engine</span><span class="dlm-brand-short">Marketing Engine</span></div>
      <nav class="dlm-mainnav" id="dlm-mainnav" aria-label="Hauptnavigation">
        <a class="dlm-mainnav-link dlm-nav-active" data-nav="avatare" href="#/">Avatare</a>
        <a class="dlm-mainnav-link" data-nav="vorlagen" href="#/vorlagen">Vorlagen</a>
      </nav>
      <nav class="dlm-crumbs" id="dlm-crumbs" aria-label="Navigation"></nav>
      <div class="dlp-bar-right">
        <span class="dlm-hello" id="dlm-hello"></span>
        <button type="button" class="dlp-theme" id="dlm-theme-btn" aria-label="Hell/Dunkel umschalten">

          <svg id="dlm-theme-ic-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="18" height="18" hidden><circle cx="12" cy="12" r="4.2"></circle><path d="M12 2.5v2.4M12 19.1v2.4M4.6 4.6l1.7 1.7M17.7 17.7l1.7 1.7M2.5 12h2.4M19.1 12h2.4M4.6 19.4l1.7-1.7M17.7 6.3l1.7-1.7"></path></svg>
        </button>
      </div>
    </header>

    <main id="app" class="dlm-main"></main>

    <footer class="dlm-footer">
      <span>Dreamlife Marketing Engine · Version <span id="dlm-version">1.2.0</span></span>
    </footer>

    <nav class="dlm-tabbar" id="dlm-tabbar" aria-label="Mobile Navigation">
      <a class="dlm-tabbar-link dlm-nav-active" data-nav="avatare" href="#/">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.6"></circle><path d="M4.5 20c0-4.1 3.4-7 7.5-7s7.5 2.9 7.5 7"></path></svg>
        <span>Avatare</span>
      </a>
      <a class="dlm-tabbar-link" data-nav="vorlagen" href="#/vorlagen">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"></rect><circle cx="8.5" cy="10" r="1.6"></circle><path d="M21 16l-5.5-5.5L9 17"></path></svg>
        <span>Vorlagen</span>
      </a>
      <button type="button" class="dlm-tabbar-link" id="dlm-tabbar-hilfe">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M9.5 9a2.5 2.5 0 1 1 3.7 2.2c-.9.5-1.2 1-1.2 1.9"></path><circle cx="12" cy="17" r="0.4" fill="currentColor"></circle></svg>
        <span>Hilfe</span>
      </button>
    </nav>

  </div>

  <div class="dlp-lock" id="dlm-lock" hidden>
    <div class="dlp-lock-card">
      <span class="dlp-ic" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>
      </span>
      <h2>Anmeldung erforderlich</h2>
      <p>Die Dreamlife Marketing Engine öffnet sich nur über deinen Mitgliederbereich in LearningSuite.</p>
    </div>
  </div>

  <div id="dlm-toasts" class="dlm-toasts" aria-live="polite"></div>
  <div id="dlm-dialogs" class="dlm-dialogs"></div>

  <div class="dlp-intro" id="dlm-intro">
    <div class="dlp-intro-scrim" id="dlm-intro-scrim"></div>
    <div class="dlp-intro-card" role="dialog" aria-modal="true" aria-labelledby="dlm-intro-title">
      <div class="dlp-intro-steps" id="dlm-intro-steps"><span></span><span></span><span></span></div>
      <div class="dlp-intro-badge">Dreamlife Marketing Engine</div>
      <div class="dlp-intro-title" id="dlm-intro-title"></div>
      <div class="dlp-intro-text" id="dlm-intro-text"></div>
      <div class="dlp-intro-actions">
        <button type="button" class="dlp-intro-back" id="dlm-intro-back" hidden>Zurück</button>
        <button type="button" class="dlp-btn dlp-primary" id="dlm-intro-next">Weiter</button>
      </div>
    </div>
  </div>

  <script src="/shared/dl-identity.js"></script>
  <script src="/shared/freebie.js"></script>
  <script src="/app.js"></script>
</body>
</html>
